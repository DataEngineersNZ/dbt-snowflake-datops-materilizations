version: 2

sources:
  - name: integration_test_source
    schema: "{{ target.schema }}"
    tables:
      - name: test_source_table
        description: Source table for stream and table auto-creation tests
        columns:
          - name: id
            data_type: number
          - name: name
            data_type: varchar(100)
          - name: created_at
            data_type: timestamp_ntz
        external:
          auto_create_table: true
          auto_maintained: true
      - name: test_source_table_no_full_refresh
        description: Source table with full refresh disabled
        columns:
          - name: id
            data_type: number
          - name: name
            data_type: varchar(100)
        external:
          auto_create_table: true
          auto_maintained: true
          disable_full_refresh: true
