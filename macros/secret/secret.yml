version: 2

macros:
  - name: materialization_secret_snowflake
    description: |
      Materialization for managing Snowflake Secret objects via dbt.
      Creates a secret used by External Access Integrations for authentication.
      Supports multiple secret types with values sourced from environment variables.

      **Config options (set under `meta` for Fusion compatibility):**
      - `type` (string, default: 'GENERIC_STRING') — Secret type: GENERIC_STRING, PASSWORD, OAUTH2_CLIENT_CREDENTIALS, or OAUTH2_AUTHORIZATION_CODE
      - `secret_string_variable` (string) — Environment variable name containing the secret string (GENERIC_STRING type)
      - `username` (string) — Username for PASSWORD type secrets
      - `password_variable` (string) — Environment variable name containing the password (PASSWORD type)
      - `security_integration` (string) — Security integration name for OAuth types
      - `oauth_scopes` (list) — OAuth scopes for client credentials flow
      - `oauth_refresh_token_variable` (string) — Environment variable for the OAuth refresh token
      - `oauth_refresh_token_expiry_time` (string) — Expiry time for the OAuth refresh token
    docs:
      show: true

  - name: snowflake_create_generic_secret_statement
    description: Generates the CREATE SECRET IF NOT EXISTS DDL for GENERIC_STRING type secrets.
    docs:
      show: false

  - name: snowflake_create_password_secret_statement
    description: Generates the CREATE SECRET IF NOT EXISTS DDL for PASSWORD type secrets with username and password.
    docs:
      show: false

  - name: snowflake_create_oauth_authorization_code_secret_statement
    description: Generates the CREATE SECRET IF NOT EXISTS DDL for OAUTH2 authorization code flow secrets.
    docs:
      show: false

  - name: snowflake_create_oauth_client_credentials_secret_statement
    description: Generates the CREATE SECRET IF NOT EXISTS DDL for OAUTH2 client credentials flow secrets.
    docs:
      show: false
