version: 2

macros:
  - name: materialization_stage_snowflake
    description: |
      Materialization for managing Snowflake Stage objects via dbt.
      Creates or replaces a stage with the SQL defined in the model body.
      Stages are staged via `on-run-start` hooks using `stage_stages`.
    docs:
      show: true

  - name: stage_stages
    description: |
      Hook macro to create stage objects during a dbt run.
      Add this to your `on-run-start` hook to ensure stages are created before models that depend on them.

      ```yml
      on-run-start:
        - "{% raw %}{{ dbt_dataengineers_materializations.stage_stages() }}{% endraw %}"
      ```
    docs:
      show: true

  - name: stage_stages_plans
    description: Iterates over stage nodes and executes their build plans.
    docs:
      show: false

  - name: get_stage_build_plan
    description: Dispatch wrapper that delegates to the adapter-specific stage build plan.
    docs:
      show: false

  - name: default__get_stage_build_plan
    description: Default adapter implementation for stage build plans.
    docs:
      show: false

  - name: snowflake__get_stage_build_plan
    description: Snowflake-specific build plan for stages. Generates the schema creation and stage DDL statements.
    docs:
      show: false

  - name: snowflake_create_or_replace_stage_statement
    description: Generates the CREATE OR REPLACE STAGE DDL statement.
    docs:
      show: false

  - name: snowflake_create_stages_if_not_exist_statement
    description: Generates a CREATE STAGE IF NOT EXISTS DDL statement.
    docs:
      show: false
